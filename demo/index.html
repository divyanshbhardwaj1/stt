<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inspections · Triburg QA</title>
<link rel="stylesheet" href="app.css" />
<script>try{document.documentElement.dataset.rail=localStorage.getItem("rail")||"open"}catch(e){}</script>
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>

  <main>
    <div data-need-team="sizeset">
      <div class="wrap">

        <!-- Intake. In the real app this sits at the top of the work pane and
             takes over the whole pane while recording. -->
        <div class="intake">
          <div class="row">
            <a class="btn" href="record.html" data-need="record">Record inspection</a>
            <span class="hint">or <a class="link" href="#">choose a recording</a> — drop one anywhere here</span>
          </div>
          <div class="opts">
            <label for="style">Check against</label>
            <select id="style">
              <option>Style announced in the recording</option>
              <option selected>7122 — smocked button through</option>
              <option>2463 — ribbed henley</option>
              <option>2365 — poplin shirt dress</option>
              <option>9662 — cropped cardigan</option>
            </select>
            <span class="hint">Seven sheets in the library</span>
          </div>
        </div>

        <header>
          <div class="page-title">
            <h1>Inspections</h1>
            <span class="pill" id="count"></span>
            <span class="spacer"></span>
            <input type="text" id="search" placeholder="Search file, style or inspector"
                   style="max-width: 280px; height: 36px" />
          </div>
          <p class="page-meta">
            Every size-set inspection on this floor. Open one for its report.
          </p>
        </header>

        <section style="margin-top: 20px">
          <div class="tabs" id="filters" style="margin-bottom: 14px"></div>
          <div class="tablewrap">
            <table class="data" id="inspections"></table>
          </div>
          <div class="blank" id="nothing" hidden style="min-height: 26vh">
            <div>
              <h2>Nothing matches that</h2>
              <p>No inspection matches what you searched for.</p>
              <div class="files" style="justify-content: center">
                <button class="btn secondary" id="clear">Clear</button>
              </div>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>
</div>

<script src="teams.js"></script>
<script src="auth.js"></script>
<script src="inspections.js"></script>
<script src="app.js"></script>
<script>
if (currentTeam() === "sizeset") {

let filter = "all";
let query = "";

/* Built from what is in the list, so a state nobody is in does not get a tab
   that returns nothing. */
const present = [...new Set(INSPECTIONS.map((i) => i.state))];
document.querySelector("#filters").innerHTML =
  '<button data-filter="all" aria-selected="true">All</button>' +
  present
    .map((k) => `<button data-filter="${k}" aria-selected="false">${STATES[k][0]}</button>`)
    .join("");

function matches(job) {
  if (filter !== "all" && job.state !== filter) return false;
  if (!query) return true;
  const who = member(job.by);
  return (job.file + " " + job.style + " " + job.description + " " + (who ? who.name : job.by))
    .toLowerCase()
    .includes(query);
}

function draw() {
  const shown = INSPECTIONS.filter(matches);
  document.querySelector("#count").textContent =
    shown.length === INSPECTIONS.length
      ? INSPECTIONS.length + " inspections"
      : shown.length + " of " + INSPECTIONS.length;
  document.querySelector("#nothing").hidden = shown.length > 0;
  document.querySelector("#inspections").closest(".tablewrap").hidden = shown.length === 0;

  document.querySelector("#inspections").innerHTML =
    `<thead><tr><th>Inspection</th><th>Style</th><th>Recorded</th>
       <th class="num">Rows</th><th class="num">No verdict</th><th class="num">Out of tol</th>
       <th>State</th><th></th></tr></thead><tbody>` +
    shown
      .map((job) => {
        const who = member(job.by);
        const n = (v) => (v === undefined || v === null ? "—" : v);
        return `
      <tr data-open="${job.id}">
        <td>
          <b>${job.file}</b>
          <div class="dim" style="font-size:11.5px">${job.len} · ${job.description}</div>
        </td>
        <td class="pom">${job.style}</td>
        <td>
          ${who ? who.name : job.by}
          <div class="dim" style="font-size:11.5px">${job.when}</div>
        </td>
        <td class="num">${n(job.rows)}</td>
        <td class="num" style="${job.open ? "color:#4c3a8a;font-weight:700" : ""}">${n(job.open)}</td>
        <td class="num" style="${job.fail ? "color:#b3261e;font-weight:700" : ""}">${n(job.fail)}</td>
        <td><span class="${STATES[job.state][1]}">${STATES[job.state][0]}</span></td>
        <td style="text-align:right">
          <a class="btn quiet sm" href="${reportUrl(job)}">Open</a>
        </td>
      </tr>`;
      })
      .join("") +
    "</tbody>";
}

/* The whole row opens the report. A table of reports where only the last
   eight pixels are clickable is a table people learn to resent. */
document.querySelector("#inspections").addEventListener("click", (event) => {
  if (event.target.closest("a")) return;
  const row = event.target.closest("tr[data-open]");
  if (row) location.href = reportUrl(inspection(row.dataset.open));
});

document.querySelector("#filters").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-filter]");
  if (!button) return;
  filter = button.dataset.filter;
  document.querySelectorAll("#filters button").forEach((b) =>
    b.setAttribute("aria-selected", String(b === button)),
  );
  draw();
});

document.querySelector("#search").addEventListener("input", (event) => {
  query = event.target.value.trim().toLowerCase();
  draw();
});

document.querySelector("#clear").addEventListener("click", () => {
  filter = "all";
  query = "";
  document.querySelector("#search").value = "";
  document.querySelectorAll("#filters button").forEach((b) =>
    b.setAttribute("aria-selected", String(b.dataset.filter === "all")),
  );
  draw();
});

draw();
gate();
}
</script>
</body>
</html>
