<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size Set Inspection Reports</title>
<style>
:root {
  --bg: #f6f7f9;   --panel: #fff;    --side: #fbfbfc;
  --ink: #14161a;  --dim: #6b7280;   --faint: #9aa1ac;
  --line: #e5e8ec; --soft: #f1f3f6;
  --accent: #2563eb; --accent-soft: #eef4ff;
  --good: #15803d; --good-soft: #e9f6ee;
  --warn: #b45309; --warn-soft: #fdf3e3;
  --bad:  #b42318; --bad-soft:  #fdecea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1014;   --panel: #15181e;  --side: #121419;
    --ink: #e9ebef;  --dim: #99a0ab;    --faint: #6e7583;
    --line: #262a32; --soft: #1c2028;
    --accent: #6b9bff; --accent-soft: #1a2334;
    --good: #57c98a; --good-soft: #16261d;
    --warn: #e0a35a; --warn-soft: #2a2114;
    --bad:  #f2836f; --bad-soft:  #2c1a17;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14.5px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.shell { display: grid; grid-template-columns: 310px 1fr; height: 100vh; }

/* ---------- sidebar ---------- */
aside {
  background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.brand { padding: 20px 18px 16px; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.brand p { margin: 3px 0 0; font-size: 11.5px; color: var(--faint); }

.upload { padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drop {
  display: block; border: 1.5px dashed var(--line); border-radius: 10px;
  padding: 18px 12px; text-align: center; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop b { display: block; font-size: 12.5px; font-weight: 600; }
.drop span { font-size: 10.5px; color: var(--faint); }
input[type=file] { display: none; }
button {
  font: inherit; font-size: 13px; font-weight: 600; width: 100%; margin-top: 10px;
  padding: 9px 12px; border: 0; border-radius: 8px;
  background: var(--accent); color: #fff; cursor: pointer;
}
button:disabled { opacity: .4; cursor: default; }
.bar { height: 5px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.err { margin-top: 9px; font-size: 12px; color: var(--bad); }

.listhead {
  padding: 14px 18px 7px; font-size: 10.5px; font-weight: 650; color: var(--faint);
  text-transform: uppercase; letter-spacing: .07em;
}
.list { flex: 1; overflow-y: auto; padding: 0 10px 16px; min-height: 0; }
.item {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  border-radius: 9px; padding: 10px 10px; margin: 0 0 2px; cursor: pointer;
  font: inherit; color: inherit;
}
.item:hover { background: var(--soft); }
.item.on { background: var(--accent-soft); }
.item .n { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 550; }
.item .n em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 11px; color: var(--dim); margin-top: 3px; padding-left: 15px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.dot.queued { background: var(--faint); }
.dot.running { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
.dot.done { background: var(--good); }
.dot.failed { background: var(--bad); }
@keyframes pulse { 50% { opacity: .25; } }
.none { padding: 10px 12px; font-size: 12.5px; color: var(--faint); }

/* ---------- main ---------- */
main { overflow-y: auto; min-height: 0; padding: 26px 30px 60px; }
.wrap { max-width: 820px; }
.blank-state { display: grid; place-content: center; height: 100%; text-align: center; color: var(--faint); }
.blank-state b { display: block; font-size: 15px; color: var(--dim); margin-bottom: 4px; }

.title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.title h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; word-break: break-all; }
.pill {
  font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 5px;
}
.pill.queued { background: var(--soft); color: var(--dim); }
.pill.running { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.failed { background: var(--bad-soft); color: var(--bad); }
.sub { color: var(--dim); font-size: 12.5px; margin-top: 5px; }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-top: 18px;
}
.panel > h3 {
  margin: 0 0 12px; font-size: 11px; font-weight: 650; color: var(--faint);
  text-transform: uppercase; letter-spacing: .07em;
}
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.stat { background: var(--soft); border-radius: 9px; padding: 11px 12px; }
.stat b { display: block; font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.stat.alert { background: var(--warn-soft); }
.stat.alert b { color: var(--warn); }

.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a {
  font-size: 12.5px; font-weight: 550; text-decoration: none; color: var(--accent);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; background: var(--panel);
}
.links a:hover { background: var(--accent-soft); border-color: var(--accent); }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  text-align: left; font-size: 10px; font-weight: 650; color: var(--faint);
  text-transform: uppercase; letter-spacing: .05em; padding: 0 8px 7px;
}
td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.low { color: var(--warn); font-weight: 650; }
.note { color: var(--dim); }
.kv { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 5px 18px; font-size: 12.5px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; word-break: break-word; }
.blank { color: var(--faint); opacity: .55; }
.running-note { display: flex; align-items: center; gap: 9px; color: var(--dim); font-size: 13px; }
.spin {
  width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px;
  border: 2px solid var(--warn); border-top-color: transparent; animation: sp .7s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
.fail { background: var(--bad-soft); color: var(--bad); border-radius: 9px; padding: 12px 14px; font-size: 12.5px; }

@media (max-width: 780px) {
  .shell { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .list { max-height: 210px; }
  main { padding: 20px 16px 50px; }
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <h1>Size Set Inspection</h1>
      <p>Recording &rarr; transcript &rarr; filled report</p>
    </div>

    <div class="upload">
      <label class="drop" id="drop" for="file">
        <b id="label">Drop a recording</b>
        <span>mp3 &middot; m4a &middot; wav &middot; webm &middot; max 25 MB</span>
      </label>
      <input type="file" id="file" accept=".mp3,.mp4,.m4a,.wav,.webm,.mpeg,.mpga">
      <button id="go" disabled>Upload and process</button>
      <div class="bar" id="bar" hidden><i id="fill"></i></div>
      <div class="err" id="err" hidden></div>
    </div>

    <div class="listhead">Jobs</div>
    <div class="list" id="list"><p class="none">Nothing uploaded yet.</p></div>
  </aside>

  <main><div id="detail"></div></main>
</div>

<script>
const $ = id => document.getElementById(id);
const TITLES = { report: "Report PDF", form: "Form CSV",
                 measurements: "Measurements CSV", data: "JSON" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dash = v => v ? esc(v) : '<span class="blank">&mdash;</span>';
const secs = n => n < 60 ? `${n.toFixed(0)}s` : `${Math.floor(n / 60)}m ${Math.round(n % 60)}s`;

let chosen = null, selected = null, lastPayload = "";

/* ---------- upload ---------- */
function choose(file) {
  chosen = file;
  $("label").textContent = file ? file.name : "Drop a recording";
  $("go").disabled = !file;
  $("err").hidden = true;
}
$("file").onchange = e => choose(e.target.files[0] || null);

const drop = $("drop");
["dragenter", "dragover"].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => choose(e.dataTransfer.files[0] || null));

$("go").onclick = () => {
  if (!chosen) return;
  $("go").disabled = true;
  $("bar").hidden = false;
  $("err").hidden = true;

  // XHR, not fetch: only XHR reports upload progress, and these files are large.
  const body = new FormData();
  body.append("recording", chosen);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/jobs");
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) $("fill").style.width = `${(e.loaded / e.total) * 100}%`;
  };
  xhr.onload = () => {
    $("bar").hidden = true;
    $("fill").style.width = "0";
    if (xhr.status === 202) {
      try { selected = JSON.parse(xhr.responseText).id; } catch {}
      $("file").value = "";
      choose(null);
      lastPayload = "";
      schedule(0);
    } else {
      let detail = `upload failed (${xhr.status})`;
      try { detail = JSON.parse(xhr.responseText).detail || detail; } catch {}
      $("err").textContent = detail;
      $("err").hidden = false;
      $("go").disabled = false;
    }
  };
  xhr.onerror = () => {
    $("bar").hidden = true;
    $("err").textContent = "network error";
    $("err").hidden = false;
    $("go").disabled = false;
  };
  xhr.send(body);
};

/* ---------- rendering ---------- */
function sidebar(jobs) {
  $("list").innerHTML = jobs.length ? jobs.map(job => `
    <button class="item ${job.id === selected ? "on" : ""}" data-id="${job.id}">
      <div class="n"><span class="dot ${job.status}"></span><em>${esc(job.filename)}</em></div>
      <div class="s">${job.status === "done"
        ? `${job.rows} rows &middot; ${job.flagged} flagged`
        : job.status === "failed" ? "failed" : esc(job.message)}</div>
    </button>`).join("") : '<p class="none">Nothing uploaded yet.</p>';

  $("list").querySelectorAll(".item").forEach(el => {
    el.onclick = () => { selected = el.dataset.id; lastPayload = ""; refresh(); };
  });
}

function flaggedTable(rows) {
  return `<table>
    <tr><th class="num">#</th><th>Size</th><th>Point of measure</th>
        <th class="num">Value</th><th class="num">Conf</th><th>Why it was flagged</th></tr>
    ${rows.map(r => `<tr>
      <td class="num">${r.no}</td>
      <td>${dash(r.size)}</td>
      <td>${esc(r.field)}</td>
      <td class="num">${dash(r.value)} ${esc(r.deviation || "")}</td>
      <td class="num low">${r.confidence.toFixed(2)}</td>
      <td class="note">${esc(r.note)}</td>
    </tr>`).join("")}</table>`;
}

function detail(job) {
  if (!job) return `<div class="blank-state"><div>
    <b>No job selected</b>Upload a recording to get started.</div></div>`;

  const running = job.status === "running" || job.status === "queued";
  const head = `<div class="wrap">
    <div class="title">
      <h2>${esc(job.filename)}</h2><span class="pill ${job.status}">${job.status}</span>
    </div>
    <div class="sub">${secs(job.elapsed)}${job.name ? " &middot; " + esc(job.name) : ""}</div>`;

  if (job.status === "failed") {
    return `${head}<div class="panel"><h3>Error</h3>
      <div class="fail">${esc(job.error)}</div></div></div>`;
  }
  if (running) {
    return `${head}<div class="panel"><h3>Progress</h3>
      <div class="running-note"><span class="spin"></span>${esc(job.message)}</div></div></div>`;
  }

  const filled = Object.values(job.form).filter(Boolean).length;
  return `${head}
    <div class="panel"><h3>Extracted</h3><div class="stats">
      <div class="stat"><b>${job.rows}</b><span>rows</span></div>
      <div class="stat"><b>${job.sizes.length ? esc(job.sizes.join(" ")) : "&mdash;"}</b><span>sizes</span></div>
      <div class="stat"><b>${job.accessories}</b><span>accessories</span></div>
      <div class="stat"><b>${job.comments}</b><span>comments</span></div>
      <div class="stat"><b>${filled}/${Object.keys(job.form).length}</b><span>form fields</span></div>
      <div class="stat ${job.flagged ? "alert" : ""}"><b>${job.flagged}</b><span>need review</span></div>
    </div></div>

    <div class="panel"><h3>Downloads</h3><div class="links">
      ${job.downloads.map(k =>
        `<a href="/api/jobs/${job.id}/download/${k}">${TITLES[k] || k}</a>`).join("")}
    </div></div>

    ${job.flagged_rows.length ? `<div class="panel">
      <h3>Needs review &mdash; ${job.flagged} of ${job.rows}</h3>
      ${flaggedTable(job.flagged_rows)}</div>` : ""}

    <div class="panel"><h3>Form fields</h3><dl class="kv">
      ${Object.entries(job.form).map(([k, v]) =>
        `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${dash(v)}</dd>`).join("")}
    </dl></div>
  </div>`;
}

function render(jobs) {
  if (selected && !jobs.some(j => j.id === selected)) selected = null;
  if (!selected && jobs.length) selected = jobs[0].id;
  sidebar(jobs);
  $("detail").innerHTML = detail(jobs.find(j => j.id === selected));
}

/* ---------- polling ---------- */
const FAST = 2000, IDLE = 15000;
let timer = null, busy = false;

async function refresh() {
  if (busy || document.hidden) return schedule(FAST);
  busy = true;
  let active = false;
  try {
    const jobs = await (await fetch("/api/jobs")).json();
    active = jobs.some(j => j.status === "running" || j.status === "queued");
    // Repainting identical data would fight the user's scroll position.
    const payload = JSON.stringify(jobs) + selected;
    if (payload !== lastPayload) { lastPayload = payload; render(jobs); }
  } catch { /* transient: the next tick retries */ }
  finally { busy = false; }
  schedule(active ? FAST : IDLE);
}

function schedule(delay) {
  clearTimeout(timer);
  timer = setTimeout(refresh, delay);
}

document.addEventListener("visibilitychange", () => !document.hidden && schedule(0));
refresh();
</script>
</body>
</html>
