<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px}.main{background:var(--color-canvas);display:flex;align-items:center;justify-content:center}.mark{font-family:var(--font-display);font-weight:500;font-size:300px;letter-spacing:-14px;color:var(--color-ink);line-height:1}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head>
<body>
<div class="tile">
<div class="main"><div class="mark">Clay</div></div>
<div class="strip"><div style="background:var(--color-brand-peach)"></div><div style="background:var(--color-brand-ochre)"></div><div style="background:var(--color-brand-pink)"></div><div style="background:var(--color-brand-teal)"></div></div>
</div>
</body>
</html>
