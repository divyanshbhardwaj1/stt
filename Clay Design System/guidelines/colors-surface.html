<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces (cream-throughout)" subtitle="Canvas, soft, card, strong + the two dark surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-canvas); font-family: var(--font-body); }
  .wrap { padding: 24px; display: flex; flex-wrap: wrap; gap: 14px; }
  .sw { width: 104px; }
  .chip { height: 64px; border-radius: var(--radius-lg); border: 1px solid var(--color-hairline); }
  .name { font: var(--text-caption); color: var(--color-ink); margin-top: 8px; }
  .hex { font: var(--text-caption); color: var(--color-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--color-canvas)"></div><div class="name">Canvas</div><div class="hex">#fffaf0</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-surface-soft)"></div><div class="name">Surface soft</div><div class="hex">#faf5e8</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-surface-card)"></div><div class="name">Surface card</div><div class="hex">#f5f0e0</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-surface-strong)"></div><div class="name">Surface strong</div><div class="hex">#ebe6d6</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-surface-dark)"></div><div class="name">Dark</div><div class="hex">#0a1a1a</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-surface-dark-elevated)"></div><div class="name">Dark elevated</div><div class="hex">#1a2a2a</div></div>
  </div>
</body>
</html>
