<!-- @dsCard group="Brand" viewport="700x170" name="Feature-card cycle" subtitle="pink → teal → lavender → peach → ochre → cream; never twice in a row" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-canvas);font-family:var(--font-body)}.wrap{padding:24px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.c{height:104px;border-radius:var(--radius-xl);padding:14px;font:var(--text-title-sm);display:flex;align-items:flex-end}</style>
</head>
<body>
<div class="wrap">
<div class="c" style="background:var(--color-brand-pink);color:var(--color-on-primary)">Sequences</div>
<div class="c" style="background:var(--color-brand-teal);color:var(--color-on-dark)">Enterprise</div>
<div class="c" style="background:var(--color-brand-lavender);color:var(--color-ink)">Claygent</div>
<div class="c" style="background:var(--color-brand-peach);color:var(--color-ink)">Enrichment</div>
<div class="c" style="background:var(--color-brand-ochre);color:var(--color-ink)">Experts</div>
<div class="c" style="background:var(--color-surface-card);color:var(--color-ink)">Integrations</div>
</div>
</body>
</html>
