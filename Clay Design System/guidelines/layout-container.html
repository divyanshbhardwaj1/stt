<!-- @dsCard group="Spacing" viewport="700x200" name="Container & rhythm" subtitle="1280px max width · 96px between editorial bands · 7/5 hero split" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-surface-strong);font-family:var(--font-body)}.page{margin:20px;background:var(--color-canvas);border-radius:var(--radius-md);padding:14px}.band{background:var(--color-surface-soft);border-radius:var(--radius-sm);height:34px;display:flex;align-items:center;justify-content:center;font:var(--text-caption);color:var(--color-muted)}.gap{height:22px;display:flex;align-items:center;justify-content:center;font:var(--text-caption);color:var(--color-muted-soft)}.split{display:grid;grid-template-columns:7fr 5fr;gap:8px;margin-top:6px}.split>div{height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font:var(--text-caption);color:var(--color-muted)}</style>
</head>
<body>
<div class="page">
<div class="band">container-max · 1280px</div>
<div class="gap">— space-section · 96px —</div>
<div class="split"><div style="background:var(--color-surface-card)">hero headline · 7</div><div style="background:var(--color-brand-lavender);color:var(--color-ink)">illustration · 5</div></div>
</div>
</body>
</html>
