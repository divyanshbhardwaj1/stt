<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-canvas); font-family: var(--font-body); color: var(--color-ink); }
  .wrap { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: baseline; gap: 20px; }
  .tag { font: var(--text-caption); color: var(--color-muted); width: 96px; flex: none; font-variant-numeric: tabular-nums; }
  .xl { font: var(--text-display-xl); letter-spacing: var(--tracking-display-xl); }
  .lg { font: var(--text-display-lg); letter-spacing: var(--tracking-display-lg); }
  .md { font: var(--text-display-md); letter-spacing: var(--tracking-display-md); }
  .sm { font: var(--text-display-sm); letter-spacing: var(--tracking-display-sm); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><span class="tag">display-xl · 72</span><span class="xl">Unique data</span></div>
    <div class="row"><span class="tag">display-lg · 56</span><span class="lg">Go to market</span></div>
    <div class="row"><span class="tag">display-md · 40</span><span class="md">Turn ideas into reality</span></div>
    <div class="row"><span class="tag">display-sm · 32</span><span class="sm">Build with Claygent</span></div>
  </div>
</body>
</html>
