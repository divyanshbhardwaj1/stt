<!-- @dsCard group="Type" viewport="700x200" name="Negative tracking rule" subtitle="Display sizes always carry negative letter-spacing; body never does" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-canvas);font-family:var(--font-body);color:var(--color-ink)}.wrap{padding:22px 24px;display:grid;gap:10px}.row{display:flex;align-items:baseline;gap:16px}.tok{font:var(--text-caption);color:var(--color-muted);width:132px;flex:none;font-variant-numeric:tabular-nums}</style>
</head>
<body>
<div class="wrap">
<div class="row"><span class="tok">display-lg / −2px</span><span style="font:var(--text-display-lg);letter-spacing:var(--tracking-display-lg)">Unique data</span></div>
<div class="row"><span class="tok">display-sm / −0.5px</span><span style="font:var(--text-display-sm);letter-spacing:var(--tracking-display-sm)">Unique data</span></div>
<div class="row"><span class="tok">title-lg / −0.3px</span><span style="font:var(--text-title-lg);letter-spacing:var(--tracking-title-lg)">Unique data</span></div>
<div class="row"><span class="tok">body-md / 0</span><span style="font:var(--text-body-md)">Unique data</span></div>
</div>
</body>
</html>
