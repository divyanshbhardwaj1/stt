<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-canvas);font-family:var(--font-body);color:var(--color-ink)}.wrap{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}.k{font:var(--text-caption-uppercase);letter-spacing:var(--tracking-caption-uppercase);text-transform:uppercase;color:var(--color-muted)}.yes{font:var(--text-title-md)}.no{font:var(--text-body-md);color:var(--color-muted-soft);text-decoration:line-through}</style>
</head>
<body>
<div class="wrap">
<div><div class="k">Do</div><div class="yes">Go to market with unique data</div><div class="yes">Try free</div><div class="yes">Book a demo</div></div>
<div><div class="k">Don't</div><div class="no">Go To Market With Unique Data</div><div class="no">Start Your Free Trial Now!</div><div class="no">🚀 Book A Demo Today</div></div>
</div>
</body>
</html>
