<!-- @dsCard group="Type" viewport="700x150" name="Support styles" subtitle="caption · caption-uppercase · button · nav-link" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--color-canvas); font-family: var(--font-body); color: var(--color-ink); }
  .wrap { padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: baseline; gap: 20px; }
  .tag { font: var(--text-caption); color: var(--color-muted); width: 150px; flex: none; }
  .cap { font: var(--text-caption); }
  .capu { font: var(--text-caption-uppercase); letter-spacing: var(--tracking-caption-uppercase); text-transform: uppercase; color: var(--color-muted); }
  .btn { font: var(--text-button); }
  .nav { font: var(--text-nav-link); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><span class="tag">caption · 13/500</span><span class="cap">New · enrichment credits</span></div>
    <div class="row"><span class="tag">caption-uppercase · 12/600</span><span class="capu">Featured</span></div>
    <div class="row"><span class="tag">button · 14/600</span><span class="btn">Try free</span></div>
    <div class="row"><span class="tag">nav-link · 14/500</span><span class="nav">Product · Solutions · Pricing</span></div>
  </div>
</body>
</html>
